name: tamagne-ci

on:
  push:
    paths: ["tamagne/**", ".github/workflows/tamagne-ci.yml"]
  pull_request:
    paths: ["tamagne/**", ".github/workflows/tamagne-ci.yml"]

permissions:
  contents: read

concurrency:
  group: tamagne-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: tamagne

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: tamagne_test
        ports: ["54339:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d tamagne_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:54339/tamagne_test
      REDIS_TEST_URL: redis://127.0.0.1:6379/0
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tamagne/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run lint
      - name: Apply migrations to the CI database
        run: DATABASE_URL=$TEST_DATABASE_URL npm run db:migrate:deploy
      - name: Unit, database and API tests
        run: npm test && npm run test:db
      - run: npm run build
      - name: Backup + restore drill (encrypted backup, restore, integrity, API readiness)
        run: |
          SOURCE_URL=$TEST_DATABASE_URL \
          DRILL_ADMIN_URL=postgresql://postgres@127.0.0.1:54339/postgres \
          BACKUP_KEY=$(openssl rand -base64 32) \
          npm run ops:restore-drill
      - name: End-to-end (Playwright, desktop + mobile)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e -w @tamagne/web

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f apps/api/Dockerfile --target runtime -t tamagne-api:ci .
      - run: docker build -f apps/api/Dockerfile --target migrate -t tamagne-migrate:ci .
      - run: docker build -f apps/web/Dockerfile -t tamagne-web:ci .
      - name: Full-stack smoke test (compose, staging mode)
        run: TAMAGNE_TAG=ci bash ops/compose-smoke.sh

  clamav:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tamagne/package-lock.json
      - name: Start clamd (signatures are refreshed by freshclam on start)
        run: |
          docker run -d --name clamav -p 127.0.0.1:3310:3310 clamav/clamav:1.4
          timeout 600 sh -c 'until docker logs clamav 2>&1 | grep -q "clamd started"; do sleep 5; done'
      - run: npm ci
      - run: npm run db:generate
      - name: Scanner adapter against a real clamd
        run: CLAMAV_TEST_HOST=127.0.0.1 npx vitest run test/adapters.test.ts
        working-directory: tamagne/apps/api
