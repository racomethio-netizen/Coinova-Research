# Render Blueprint (https://render.com/docs/blueprint-spec).
# Review before applying: creating these services incurs cost. Secrets are
# declared with `sync: false` so they are entered in the Render dashboard,
# never stored in this file. The database is a separate Supabase project.
services:
  - type: web
    name: cryptoscope-web
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_ENV
        value: production
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MARKET_DATA_PROVIDER
        value: coingecko
      - key: COINGECKO_API_PLAN
        value: demo
      - key: COINGECKO_API_KEY
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: BILLING_PROVIDER
        value: none
      # NEXUS compliance gates (docs/nexus/COMPLIANCE.md). Change only by owner-approved deploy.
      - key: SIGNALS_VISIBILITY
        value: staff
      - key: PAID_SIGNALS_ENABLED
        value: "false"
      - key: LIVE_EXECUTION_ENABLED
        value: "false"

  # NEXUS engine (docs/DEPLOYMENT.md section 2b): market data, signals, outcomes, backtests,
  # paper fills, the nightly ledger export, AND the web cron jobs (formerly four Render cron
  # services). It runs as the least-privilege `nexus_engine` role, never the service role.
  - type: worker
    name: nexus-engine
    runtime: docker
    plan: starter
    dockerfilePath: ./engine/Dockerfile
    dockerContext: ./engine
    dockerCommand: nexus-engine worker
    autoDeploy: false
    disk:
      # Holds nightly ledger exports; copy them off-site (docs/nexus/RUNBOOKS.md). Disks cost extra.
      name: ledger-exports
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: WEB_CRON_URL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: LEDGER_EXPORT_DIR
        value: /var/data/ledger
      - key: SIGNALS_VISIBILITY
        value: staff
      - key: PAID_SIGNALS_ENABLED
        value: "false"
      - key: LIVE_EXECUTION_ENABLED
        value: "false"

  # Watchdog: deliberately NOT run by the engine, so a dead engine is still detected.
  # check-health alerts admins about stale heartbeats, ingestion lag, failing jobs and
  # missing ledger exports (docs/nexus/RUNBOOKS.md).
  - type: cron
    name: nexus-watchdog
    runtime: node
    plan: starter
    schedule: "*/5 * * * *"
    buildCommand: "true"
    startCommand: 'curl -fsS -m 120 -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/check-health"'
    envVars:
      - key: APP_URL
        sync: false
      - key: CRON_SECRET
        sync: false
