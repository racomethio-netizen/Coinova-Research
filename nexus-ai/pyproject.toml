[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-ai"
version = "0.1.0"
description = "NEXUS AI: multi-exchange crypto SPOT trading system (paper-first, personal use)"
requires-python = ">=3.12"
# Pinned exactly; each version was released at least two weeks before adoption.
# Re-audited with pip-audit (see docs/SECURITY.md).
dependencies = [
  "fastapi==0.162.0",
  "starlette==1.10.0",  # explicit: patched release (fastapi allows older vulnerable ones)
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.1.6",
  "alembic==1.20.1",
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
  "psycopg[binary]==3.3.6",
  "redis==8.1.0",
  "cryptography==50.0.2",
  "structlog==26.1.0",
  "ccxt==4.5.91",
  "httpx==0.28.1",
  "numpy==2.5.4",
  "pandas==3.1.0",
  "scikit-learn==1.9.1",
  "xgboost-cpu==3.4.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1",
  "ruff==0.17.3",
  "mypy==2.4.1",
]

# Each top-level directory in the required layout holds one importable package.
[tool.setuptools.packages.find]
where = [
  "packages/common",
  "packages/configuration",
  "packages/database",
  "packages/security",
  "services/exchange-gateway",
  "services/market-data",
  "services/strategies",
  "services/ai-engine",
  "services/risk-engine",
  "services/execution-engine",
  "services/notification-engine",
  "research/backtesting",
  "apps/api",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "db: needs a real PostgreSQL (NEXUS_DATABASE_URL); skipped otherwise",
  "redis: needs a real Redis (NEXUS_REDIS_URL); skipped otherwise",
  "live_exchange: hits a real exchange API; never runs by default",
  "slow: takes more than a few seconds",
]
addopts = "-ra --strict-markers -m 'not live_exchange'"
filterwarnings = ["error::DeprecationWarning:nexus_.*", "ignore:Unknown solver options:scipy.optimize.OptimizeWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["apps/dashboard"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DTZ", "RUF", "ASYNC"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "packages/common:packages/configuration:packages/database:packages/security:services/exchange-gateway:services/market-data:services/strategies:services/ai-engine:services/risk-engine:services/execution-engine:services/notification-engine:research/backtesting:apps/api"
explicit_package_bases = true
exclude = ["tests/", "migrations/"]

[[tool.mypy.overrides]]
module = ["ccxt.*", "sklearn.*", "xgboost.*", "pandas.*"]
ignore_missing_imports = true
