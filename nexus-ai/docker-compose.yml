# NEXUS AI: base stack (development and staging). Production adds
# infrastructure/docker/compose.prod.yml (Nginx/HTTPS, backups) in Phase 14.
#
#   cp .env.example .env    # then fill in the secrets
#   docker compose up -d --build
#
# Nothing is published on public interfaces: ports bind to 127.0.0.1 only.

name: nexus-ai

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

x-python-env: &python-env
  NEXUS_APP_ENV: ${NEXUS_APP_ENV:-development}
  NEXUS_LOG_LEVEL: ${NEXUS_LOG_LEVEL:-INFO}
  NEXUS_DATABASE_URL: postgresql+psycopg://nexus:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/nexus
  NEXUS_REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
  NEXUS_CREDENTIAL_ENCRYPTION_KEYS: ${NEXUS_CREDENTIAL_ENCRYPTION_KEYS:-}
  NEXUS_SESSION_SECRET: ${NEXUS_SESSION_SECRET:-}
  NEXUS_TRADING_MODE: ${NEXUS_TRADING_MODE:-paper}
  NEXUS_LIVE_TRADING_ENABLED: ${NEXUS_LIVE_TRADING_ENABLED:-false}
  NEXUS_LIVE_TRADING_ACK: ${NEXUS_LIVE_TRADING_ACK:-}
  NEXUS_TELEGRAM_BOT_TOKEN: ${NEXUS_TELEGRAM_BOT_TOKEN:-}
  NEXUS_TELEGRAM_CHAT_ID: ${NEXUS_TELEGRAM_CHAT_ID:-}
  NEXUS_MARKET_BACKFILL_DAYS: ${NEXUS_MARKET_BACKFILL_DAYS:-120}

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      TZ: UTC
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_min_duration_statement=1000"]
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
    security_opt: ["no-new-privileges:true"]

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}",
              "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    logging: *logging
    security_opt: ["no-new-privileges:true"]

  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/python.Dockerfile
      secrets: [extra_ca]
    image: nexus-ai/python:${NEXUS_IMAGE_TAG:-dev}
    command: ["alembic", "upgrade", "head"]
    environment: *python-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    logging: *logging
    <<: *hardening

  api:
    image: nexus-ai/python:${NEXUS_IMAGE_TAG:-dev}
    restart: unless-stopped
    environment: *python-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    ports: ["127.0.0.1:${API_HOST_PORT:-8000}:8000"]
    read_only: true
    tmpfs: ["/tmp"]
    mem_limit: 1g
    logging: *logging
    <<: *hardening

  market-data:
    image: nexus-ai/python:${NEXUS_IMAGE_TAG:-dev}
    command: ["python", "-m", "nexus_market.runner"]
    restart: unless-stopped
    environment: *python-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,redis,sys; r=redis.from_url(os.environ['NEXUS_REDIS_URL']); sys.exit(0 if r.exists('nexus:heartbeat:market-data:candles') else 1)\""]
      interval: 60s
      timeout: 5s
      start_period: 600s
      retries: 3
    read_only: true
    tmpfs: ["/tmp"]
    mem_limit: 768m
    logging: *logging
    <<: *hardening


secrets:
  extra_ca:
    file: ${EXTRA_CA_FILE:-/dev/null}

volumes:
  pgdata:
  redisdata:
