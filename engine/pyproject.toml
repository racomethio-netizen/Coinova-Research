[project]
name = "nexus-engine"
version = "0.1.0"
description = "NEXUS AI engine: market-data ingestion (Phase 3); signals, backtests and paper fills in later phases."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "psycopg[binary,pool]>=3.2",
  "httpx>=0.27",
  "numpy>=2.5.4",
]

[project.scripts]
nexus-engine = "nexus_engine.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "hypothesis>=6",
  "ruff>=0.6",
  "mypy>=1.11",
  "pip-audit>=2.7",
  "ta-lib>=0.8.2",
]
research = [
    "scikit-learn>=1.9.1",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_engine"]

[tool.uv]
# CLAUDE.md: dependencies must be at least two weeks old. uv refuses anything newer.
exclude-newer = "2026-10-27T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "db: needs the local test PostgreSQL (scripts/db-test.sh up)",
  "live: calls real public market-data endpoints (opt-in: NEXUS_LIVE_TESTS=1)",
]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "DTZ", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[[tool.mypy.overrides]]
# scikit-learn ships no type information; its calls are confined to validation/models.py.
module = ["sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["nexus_engine.validation.models"]
disallow_untyped_calls = false
